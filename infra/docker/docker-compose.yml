# =============================================================================
# VEGA — local development stack (Module 1)
#
#   pnpm stack:up      start
#   pnpm stack:logs    follow
#   pnpm stack:down    stop
#   pnpm stack:reset   stop AND DELETE VOLUMES
#
# Target: cold clone to running stack in under 5 minutes (docs/module1.md §13).
#
# NOTE: `postgres-evidence` is a SEPARATE INSTANCE on purpose. Invariant 1
# (docs/PROJECT.md §10.2) says the execution plane may append to the evidence
# plane and nothing else. Sharing one instance here would make it trivially easy
# to violate that in code later. Keep them separate even locally.
# =============================================================================

name: vega

services:
  # ---------------------------------------------------------------- primary DB
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vega
      POSTGRES_USER: vega
      POSTGRES_PASSWORD: vega_local_dev_only
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb/primary:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vega -d vega']
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------- evidence DB
  postgres-evidence:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vega_evidence
      POSTGRES_USER: vega_evi
      POSTGRES_PASSWORD: vega_evi_local_dev_only
    ports:
      - '5433:5432'
    volumes:
      - postgres-evidence-data:/var/lib/postgresql/data
      - ./initdb/evidence:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vega_evi -d vega_evidence']
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------- Valkey
  # Valkey, not Redis (docs/TECHSTACK.md §7.1 — BSD-3, Linux Foundation)
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'no']
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ Zitadel
  # Identity: organizations per tenant, machine users for agent identities.
  # Pinned (TECHSTACK Appendix A): the IdentityAdmin contract test was verified on v4.19.1.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.1
    restart: unless-stopped
    command: >
      start-from-init
      --masterkeyFromEnv
      --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: MasterkeyNeedsToHave32Characters
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_DATABASE_POSTGRES_HOST: postgres-zitadel
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel_local
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel_local
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Password1!
      # A bootstrap machine user whose PAT lands in ./secrets, so `pnpm idp:bootstrap` can
      # create the project, app and provisioner with no console clicks (Step 3).
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'
      ZITADEL_FIRSTINSTANCE_PATPATH: /secrets/zitadel-bootstrap.pat
      # The v1 login UI ships in this image; login v2 would need a second container.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: 'false'
    volumes:
      - ./secrets:/secrets
    depends_on:
      postgres-zitadel:
        condition: service_healthy
    ports:
      - '8080:8080'

  postgres-zitadel:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel_local
    volumes:
      - postgres-zitadel-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zitadel -d zitadel']
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ OpenFGA
  # Relationship-based authorization. Needed from M1 for roles; load-bearing at
  # M9 for ACL-aware retrieval, which is a relationship-graph problem.
  openfga-migrate:
    image: openfga/openfga:v1.21.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://vega:vega_local_dev_only@postgres:5432/vega?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.21.0
    restart: unless-stopped
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://vega:vega_local_dev_only@postgres:5432/vega?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: 'true'
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - '8081:8080' # HTTP API
      - '8082:3000' # playground
      - '8083:8081' # gRPC

  # ------------------------------------------------ Object storage (Module 5+)
  # SeaweedFS S3 (TECHSTACK §11.3). Module 5 distributes signed policy bundles through it;
  # Modules 6/7 add content-addressed blobs and evidence. Deployed WORM uses cloud S3 Object Lock.
  # One volume per new collection (bucket): the default of seven exhausts a laptop-sized store.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json', '-volume.max=100', '-master.volumeSizeLimitMB=64']
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: '1'
    volumes:
      - ./seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data
    ports:
      - '8333:8333' # S3 API

  # ------------------------------------------------------ OPA (Module 5, C3)
  # The policy evaluator. It loads ONLY signed bundles: a signed discovery bundle (from object
  # storage) names the presets bundle and every tenant's bundle. Its configuration — which embeds
  # the verification key — is written by the control plane on first start (or `pnpm policy:setup`)
  # into ./secrets; until then this container restarts, and every action is DENIED (fail closed).
  opa:
    image: openpolicyagent/opa:1.10.1-static
    restart: unless-stopped
    command: ['run', '--server', '--addr', '0.0.0.0:8181', '--config-file', '/secrets/opa-config.yaml']
    environment:
      AWS_ACCESS_KEY_ID: vega_local
      AWS_SECRET_ACCESS_KEY: vega_local_dev_only
      AWS_REGION: us-east-1
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      - seaweedfs
    ports:
      - '8181:8181'

  # ------------------------------------------------- Presidio (Module 5, §5.3)
  # PII/PHI detection: the one place Python earns its place in the serving path. Pinned: the
  # recall gate (≥ 95% on the professional-services corpus) was measured on this version.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    restart: unless-stopped
    ports:
      - '5002:3000'

  # -------------------------------------------------------- OTel + SigNoz(lite)
  # Full SigNoz is heavy for a laptop. Jaeger gives trace correlation in dev;
  # SigNoz/ClickHouse arrives with the deployed environment.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

volumes:
  seaweedfs-data:
  postgres-data:
  postgres-evidence-data:
  postgres-zitadel-data:
  valkey-data:
