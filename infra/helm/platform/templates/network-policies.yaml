{{- /*
  =============================================================================
  Plane separation as a NETWORK control — docs/module1.md §3.1. "Separation is enforced by
  network policy and IAM, not by application code."

      From        To           Allowed
      experience  control      gateway only
      control     execution    execution API only
      execution   evidence     evidence /append port only (the service exposes nothing else)
      evidence    execution    NONE
      execution   evidence-db  NONE
      execution   web-fetch    fetch API only (module2.md §10.3)
      control     web-fetch    webhook delivery only (module4.md §7)
      control     model        planner / intent model endpoint, by name (module4.md §9)
      execution   extractor    extract API only (module3.md §3.1)
      execution   opa          the decision API only (module5.md §3)
      execution   presidio     the analyzer only (module5.md §5.3)
      opa         storage      signed bundles in object storage, 443 only; nothing else
      presidio    anything     NOTHING but DNS
      control     storage      writes signed bundles (module5.md §8.2)
      extractor   anything     NOTHING but DNS and the model endpoint — no tools, no data, no web
      web-fetch   internet     80/443 to PUBLIC addresses only — private, link-local, loopback
                               and cloud-metadata ranges are excluded at the network layer

  Every namespace starts at default-deny for ingress AND egress; each rule below opens one
  flow, named for what it is for. infra/tests/plane-separation.sh asserts the table.
  =============================================================================
*/ -}}
{{- $ex := include "ns.experience" . -}}
{{- $co := include "ns.control" . -}}
{{- $xe := include "ns.execution" . -}}
{{- $ev := include "ns.evidence" . -}}
{{- define "peer" -}}
- matchLabels:
    k8s:io.kubernetes.pod.namespace: {{ .ns }}
    app.kubernetes.io/name: {{ .app }}
{{- end -}}
{{- define "tcp" -}}
- ports:
{{- range . }}
    - { port: {{ . | quote }}, protocol: TCP }
{{- end }}
{{- end -}}
{{- define "cidrs" -}}
{{- range . }}
    - {{ . }}
{{- end }}
{{- end -}}
{{- /* FQDN egress needs Cilium's DNS proxy to see the lookups: one L7 DNS rule per policy. */ -}}
{{- define "fqdnEgress" -}}
- toEndpoints:
    - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
  toPorts:
    - ports: [{ port: "53", protocol: ANY }]
      rules: { dns: [{ matchPattern: "*" }] }
- toFQDNs:
{{- range . }}
    - matchName: {{ . | quote }}
{{- end }}
  toPorts:
    - ports: [{ port: "443", protocol: TCP }]
{{- end -}}

{{- range $ns := list $ex $co $xe $ev }}
---
# Default deny, both directions. An empty rule selects no peer.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: default-deny, namespace: {{ $ns }} }
spec:
  endpointSelector: {}
  ingress: [{}]
  egress: [{}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: allow-dns, namespace: {{ $ns }} }
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
{{- end }}

# ============================================================ experience
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: web, namespace: {{ $ex }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: web } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 3000) | nindent 8 }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.network.ingressFrom.namespace }}
            {{- toYaml .Values.network.ingressFrom.podLabels | nindent 12 }}
      toPorts: {{- include "tcp" (list 3000) | nindent 8 }}
  egress:
    - toEndpoints: {{- include "peer" (dict "ns" $co "app" "gateway") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3001) | nindent 8 }}

# ============================================================ control
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: gateway, namespace: {{ $co }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 3001) | nindent 8 }}
    - fromEndpoints:
        {{- include "peer" (dict "ns" $ex "app" "web") | nindent 8 }}
        {{- include "peer" (dict "ns" $co "app" "control") | nindent 8 }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.network.ingressFrom.namespace }}
            {{- toYaml .Values.network.ingressFrom.podLabels | nindent 12 }}
      toPorts: {{- include "tcp" (list 3001) | nindent 8 }}
  egress:
    - toEndpoints: {{- include "peer" (dict "ns" $co "app" "control") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3002) | nindent 8 }}
    {{- if .Values.devDependencies.enabled }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "postgres-primary") | nindent 8 }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "valkey") | nindent 8 }}
      toPorts: {{- include "tcp" (list 6379) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.primaryDatabase }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.identityProvider }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 443) | nindent 8 }}
    {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: control, namespace: {{ $co }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: control } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 9000) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $co "app" "gateway") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3002) | nindent 8 }}
  egress:
    - toEndpoints: {{- include "peer" (dict "ns" $co "app" "gateway") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3001) | nindent 8 }}
    - toEndpoints: {{- include "peer" (dict "ns" $xe "app" "execution") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3003) | nindent 8 }}
    {{- if .Values.devDependencies.enabled }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "postgres-primary") | nindent 8 }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "openfga") | nindent 8 }}
      toPorts: {{- include "tcp" (list 8080) | nindent 8 }}
    # Module 6: the fast revoke path reads precomputed revokers from Valkey.
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "valkey") | nindent 8 }}
      toPorts: {{- include "tcp" (list 6379) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.primaryDatabase }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.cache }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 6379) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.identityProvider }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 443) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.authorization }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 443 8080) | nindent 8 }}
    {{- end }}
    # Module 2: authorization-code exchange and token revocation (the control plane holds the
    # OAuth client secrets). Provider DATA APIs are not reachable from here.
    {{- with .Values.network.egress.oauthProviders }}
    {{- include "fqdnEgress" . | nindent 4 }}
    {{- end }}
    # Module 4: the planner (C2) and intent model (C1) — the model endpoint, by name. They see
    # only the principal's words and metadata (docs/module3.md §7.5), never content.
    {{- with .Values.network.egress.modelGateway }}
    {{- include "fqdnEgress" . | nindent 4 }}
    {{- end }}
    # Module 4: outbound webhooks are DELIVERED by the isolated web-fetch pod, not from here.
    - toEndpoints: {{- include "peer" (dict "ns" $xe "app" "web-fetch") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3005) | nindent 8 }}
    # Module 5: signed policy bundles are WRITTEN to object storage; OPA reads them from there.
    {{- with .Values.network.egress.objectStorage }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 443) | nindent 8 }}
    {{- end }}

# ============================================================ execution
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: execution, namespace: {{ $xe }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: execution } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 9000) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $co "app" "control") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3003) | nindent 8 }}
  egress:
    # INVARIANT 1: the ONLY route into the evidence plane — its service port, nothing else.
    # There is no rule to the evidence database; default-deny makes that connection impossible.
    - toEndpoints: {{- include "peer" (dict "ns" $ev "app" "evidence") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3004) | nindent 8 }}
    {{- if .Values.devDependencies.enabled }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "postgres-primary") | nindent 8 }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.primaryDatabase }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    {{- end }}
    # Module 2: the web is fetched by the isolated web-fetch pod, never by this one.
    - toEndpoints: {{- include "peer" (dict "ns" $xe "app" "web-fetch") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3005) | nindent 8 }}
    # Module 3: untrusted content is shown to a model only in the quarantined extractor.
    - toEndpoints: {{- include "peer" (dict "ns" $xe "app" "extractor") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3006) | nindent 8 }}
    # Module 5: every step is decided by OPA; generated content is classified by Presidio.
    - toEndpoints: {{- include "peer" (dict "ns" $xe "app" "opa") | nindent 8 }}
      toPorts: {{- include "tcp" (list 8181) | nindent 8 }}
    - toEndpoints: {{- include "peer" (dict "ns" $xe "app" "presidio") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3000) | nindent 8 }}
    {{- if .Values.devDependencies.enabled }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $co "app" "valkey") | nindent 8 }}
      toPorts: {{- include "tcp" (list 6379) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.cache }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 6379) | nindent 8 }}
    {{- end }}
    # Connector runtime: provider data APIs and token refresh, by name.
    {{- with .Values.network.egress.connectorApis }}
    {{- include "fqdnEgress" . | nindent 4 }}
    {{- end }}
    # Attached MCP servers (tenant-configured), by CIDR, admitted explicitly per deployment.
    {{- with .Values.network.egress.mcpServers }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 443 80) | nindent 8 }}
    {{- end }}
---
# The isolated web fetcher (docs/module2.md §10.3). It ingests attacker-controlled content, so
# the network does not trust it either: public addresses only, from exactly one caller.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: web-fetch, namespace: {{ $xe }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: web-fetch } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 9000) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $xe "app" "execution") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3005) | nindent 8 }}
    # Module 4: webhook delivery (/deliver) — signed by control, sent from here.
    - fromEndpoints: {{- include "peer" (dict "ns" $co "app" "control") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3005) | nindent 8 }}
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
          {{- range .Values.network.webFetch.deniedRanges }}
            - {{ . }}
          {{- end }}
        {{- if .Values.network.webFetch.ipv6 }}
        - cidr: ::/0
          except:
          {{- range .Values.network.webFetch.deniedRangesV6 }}
            - {{ . }}
          {{- end }}
        {{- end }}
      toPorts: {{- include "tcp" (list 80 443) | nindent 8 }}

---
# The quarantined extractor (docs/module3.md §3.1): "a separate deployment with no service
# account, enforced by Cilium policy". It can be called by the interpreter and can call the
# model — nothing else, so a fully hijacked extraction model has nowhere to send anything.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: extractor, namespace: {{ $xe }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: extractor } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 9000) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $xe "app" "execution") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3006) | nindent 8 }}
  {{- with .Values.network.egress.modelGateway }}
  egress:
    {{- include "fqdnEgress" . | nindent 4 }}
  {{- else }}
  egress: [{}]
  {{- end }}

# ============================================================ evidence
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: evidence, namespace: {{ $ev }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: evidence } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 9000) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $xe "app" "execution") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3004) | nindent 8 }}
  egress:
    # No rule toward the execution plane exists: evidence cannot initiate that connection.
    {{- if .Values.devDependencies.enabled }}
    - toEndpoints:
        {{- include "peer" (dict "ns" $ev "app" "postgres-evidence") | nindent 8 }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    {{- end }}
    {{- with .Values.network.egress.evidenceDatabase }}
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 5432) | nindent 8 }}
    {{- end }}
---
# Module 5: the policy evaluator. Asked by the execution pod only; reaches object storage only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: opa, namespace: {{ $xe }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: opa } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 8181) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $xe "app" "execution") | nindent 8 }}
      toPorts: {{- include "tcp" (list 8181) | nindent 8 }}
  {{- with .Values.network.egress.objectStorage }}
  egress:
    - toCIDR: {{- include "cidrs" . }}
      toPorts: {{- include "tcp" (list 443) | nindent 8 }}
  {{- end }}
---
# Module 5: PII/PHI detection. Asked by the execution pod only; it reaches nothing at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: presidio, namespace: {{ $xe }} }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: presidio } }
  ingress:
    - fromEntities: [host]
      toPorts: {{- include "tcp" (list 3000) | nindent 8 }}
    - fromEndpoints: {{- include "peer" (dict "ns" $xe "app" "execution") | nindent 8 }}
      toPorts: {{- include "tcp" (list 3000) | nindent 8 }}
