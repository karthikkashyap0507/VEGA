# =============================================================================
# platform chart — docs/module1.md §3.1, implementation plan Step 8.
#
# THE POINT OF THIS CHART is the boundary between planes, not the workloads:
#   · four namespaces, default-deny in every one, explicit allows only
#   · the execution plane holds NO evidence-database credential and has NO route to it
#   · the evidence plane cannot initiate a connection to the execution plane
#   · every hop between namespaces is mTLS with certificates from one plane CA
# infra/tests/plane-separation.sh asserts all of it against the deployed cluster.
# =============================================================================

# Namespaces are <prefix>-experience, <prefix>-control, <prefix>-execution, <prefix>-evidence.
prefix: vega

image:
  service: { repository: platform/service, tag: dev, pullPolicy: IfNotPresent }
  web: { repository: platform/web, tag: dev, pullPolicy: IfNotPresent }

# NODE_ENV for the services. `production` refuses to start without TLS, a principal signing
# key, pinned OpenFGA ids and the Zitadel service account (see services/*/src/main.ts).
environment: production

replicas: { web: 1, gateway: 1, control: 1, execution: 1, evidence: 1, web-fetch: 1, extractor: 1 }

# Models (module3.md §9). The extractor reaches the model through the gateway only.
models:
  extractor: claude-haiku-4-5-20251001
  planner: claude-opus-5          # C2 (module4.md §9), pinned per run
  routine: claude-sonnet-5        # C1 mention extraction
  gatewayUrl: ""        # LiteLLM URL; empty → the provider API directly (ANTHROPIC_API_KEY)

# SearXNG (web.search) — an operator-run service; empty disables search.
search: { searxngUrl: "" }

publicUrls:
  web: https://app.example.invalid
  gateway: https://api.example.invalid

mtls:
  # cert-manager issues every workload a certificate from one plane CA (a ClusterIssuer, so
  # all four namespaces chain to the same root). Disable only for a CNI/debug spike.
  enabled: true
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d

# Per-plane Secrets, created out of band (External Secrets / OpenBao in deployed envs).
# Each lives ONLY in its own plane's namespace. There is deliberately no key for the evidence
# database anywhere under `execution`.
secrets:
  control: control-secrets       # DATABASE_URL, DATABASE_APP_URL, SESSION_SECRET, LOCAL_KEK_BASE64|KMS_*, OPENFGA_*, ZITADEL_*, EXECUTION_INTERNAL_TOKEN, CONNECTOR_STATE_SECRET, *_CLIENT_ID/SECRET, RUN_TOKEN_KEY_PEM (M4: signs run tokens), ANTHROPIC_API_KEY | LITELLM_MASTER_KEY (M4: planner), OPA_BUNDLE_SIGNING_KEY + S3_ENDPOINT/S3_REGION/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY (M5: signs and writes policy bundles)
  execution: execution-secrets   # EVIDENCE_APPEND_TOKEN, DATABASE_APP_URL, EXECUTION_INTERNAL_TOKEN, LOCAL_KEK_BASE64|KMS_*, VALKEY_URL, *_CLIENT_ID/SECRET, DBOS_SYSTEM_DATABASE_URL (M4: the executor's own database), RUN_TOKEN_JWKS (M4: public keys only)
  # web-fetch gets NO Secret at all (module2.md §10.3).
  evidence: evidence-secrets     # EVIDENCE_DATABASE_URL, EVIDENCE_WRITER_URL, EVIDENCE_APPEND_TOKEN
  # The quarantined extractor gets its service token and a MODEL key — nothing else: no
  # database URL, no KEK, no connector credential (module3.md §3.1).
  extractor: extractor-secrets   # EXTRACTOR_TOKEN, ANTHROPIC_API_KEY | LITELLM_MASTER_KEY

externalSecrets:
  enabled: false
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }

# Where traffic that is not ours comes from and goes to.
network:
  # Pods of the ingress controller, allowed to reach web (3000) and gateway (3001).
  ingressFrom:
    namespace: ingress-nginx
    podLabels: { app.kubernetes.io/name: ingress-nginx }
  # Egress destinations outside the cluster, as CIDRs. Empty lists mean "none".
  egress:
    primaryDatabase: []   # control + execution
    evidenceDatabase: []  # evidence only
    identityProvider: []  # gateway + control (Zitadel)
    authorization: []     # control (OpenFGA), when external
    cache: []             # execution (Valkey: connector rate limits), when external
    # Module 2. FQDNs, resolved through Cilium's DNS proxy. Control exchanges and revokes
    # OAuth grants; execution calls the data APIs and refreshes tokens.
    oauthProviders: [oauth2.googleapis.com, login.microsoftonline.com, slack.com]
    connectorApis:
      - gmail.googleapis.com
      - www.googleapis.com
      - oauth2.googleapis.com
      - graph.microsoft.com
      - login.microsoftonline.com
      - slack.com
    mcpServers: []        # execution: CIDRs of attached MCP servers
    objectStorage: []     # control (writes bundles) + OPA (reads them), port 443 — Module 5
    # The quarantined extractor's ONLY egress: the model endpoint, by name.
    modelGateway: [api.anthropic.com]
  # The isolated web fetcher's egress: everything public on 80/443, minus these ranges.
  webFetch:
    deniedRanges:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16   # link-local: cloud metadata (169.254.169.254)
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.168.0.0/16
      - 198.18.0.0/15
      - 224.0.0.0/4
      - 240.0.0.0/4
    ipv6: false
    deniedRangesV6: ["::1/128", "fc00::/7", "fe80::/10", "::ffff:0:0/96", "64:ff9b::/96"]

# Module 5 — the policy engine's execution-side services (docs/module5.md §3, §9, §10).
policy:
  # Off only in the kind policy-test profile: without OPA every action is DENIED (fail closed).
  enabled: true
  # Where signed bundles live (object storage). Control writes; OPA reads (read-only role).
  bucket: vega-policy
  opa:
    image: { repository: openpolicyagent/opa, tag: 1.10.1-static, pullPolicy: IfNotPresent }
    replicas: 2
    # The ES256 PUBLIC key every bundle is verified with (the private half is control's
    # OPA_BUNDLE_SIGNING_KEY). A bundle whose signature does not verify is never loaded.
    bundleVerificationKey: ""
    # The bucket as OPA reaches it, path-style (e.g. https://s3.eu-west-1.amazonaws.com/vega-policy).
    storeUrl: ""
    # A Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION of a READ-ONLY
    # role scoped to the policy bucket (SigV4-signed fetches).
    storeSecret: opa-store-readonly
    polling: { min: 10, max: 30 }
  presidio:
    # Pinned: the ≥95% recall gate was measured on this version (packages/policy-engine test corpus).
    image: { repository: mcr.microsoft.com/presidio-analyzer, tag: 2.2.362, pullPolicy: IfNotPresent }
    replicas: 1

# In-cluster Postgres x2, OpenFGA and Valkey — for kind/k3s policy tests and local clusters
# ONLY. Deployed environments use managed databases reached through `network.egress`.
devDependencies:
  enabled: false
