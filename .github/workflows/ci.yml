name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Gate order mirrors docs/module1.md 11 and docs/TECHSTACK.md 21.
  # Gates for later modules are declared here as skipped placeholders ON PURPOSE:
  # they must be visibly missing rather than silently absent, so nobody ships a
  # module without turning its gate on.
  # ---------------------------------------------------------------------------

  quality:
    name: Lint / Typecheck / Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Architectural invariants
        run: pnpm verify:invariants

  test:
    name: Unit + Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vega_test
          POSTGRES_USER: vega
          POSTGRES_PASSWORD: vega_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vega" --health-interval 5s
          --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://vega:vega_test@localhost:5432/vega_test
      VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test

  tenant-isolation:
    name: Tenant isolation (BLOCKING)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vega_test
          POSTGRES_USER: vega
          POSTGRES_PASSWORD: vega_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vega" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vega:vega_test@localhost:5432/vega_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Adversarial cross-tenant suite
        run: pnpm --filter @vega/db test:isolation

  security:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ---- gates for later modules: intentionally visible, intentionally not yet on ----
  taint-soundness:
    name: 'Taint soundness (M3 — not yet implemented)'
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Enable when packages/taint lands. BLOCKING thereafter."

  redteam-injection:
    name: 'Red-team injection (M3 — not yet implemented)'
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Zero successful exfiltrations. BLOCKING thereafter."

  compensator-correctness:
    name: 'Compensator correctness (M6 — not yet implemented)'
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "A connector cannot register without a tested compensator."

  chain-integrity:
    name: 'Audit chain integrity (M7 — not yet implemented)'
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "P0 on failure once the evidence plane lands."
