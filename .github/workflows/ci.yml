name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Local-only credentials of the CI databases. Never used outside this workflow.
  DATABASE_URL: postgresql://vega:vega_local_dev_only@localhost:5432/vega
  DATABASE_APP_URL: postgresql://vega_app:vega_app_local_dev_only@localhost:5432/vega
  EVIDENCE_DATABASE_URL: postgresql://vega_evi:vega_evi_local_dev_only@localhost:5433/vega_evidence
  EVIDENCE_WRITER_URL: postgresql://vega_evi_writer:vega_evi_writer_local@localhost:5433/vega_evidence
  OPENFGA_API_URL: http://localhost:8081
  # Module 5: a plain OPA server for the policy suites, Presidio, and SeaweedFS (S3).
  OPA_TEST_URL: http://localhost:8182
  PRESIDIO_TEST_URL: http://localhost:5002
  S3_ENDPOINT: http://127.0.0.1:8333
  S3_ACCESS_KEY_ID: vega_local
  S3_SECRET_ACCESS_KEY: vega_local_dev_only

# -----------------------------------------------------------------------------
# Gate order mirrors docs/module1.md §11 and docs/TECHSTACK.md §21:
#   lint → typecheck → invariants → unit/integration → tenant isolation → e2e → security
# and the plane-separation policy test against a deployed (kind + Cilium) cluster.
#
# Gates belonging to modules not yet implemented are declared as DISABLED jobs (`if: false`)
# ON PURPOSE: a missing gate must be visible in the Actions tab, not silently absent.
# Enabling a gate is part of the step that implements it, not a follow-up.
# -----------------------------------------------------------------------------

jobs:
  quality:
    name: Lint / Typecheck / Invariants / Lint-rule fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes the architectural invariant rules)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Architectural invariants (BRAND/PLANE/TIER/EVAL/SEC/DB)
        run: pnpm verify:invariants
      - name: Lint-rule fixtures — a violating fixture must fail
        run: pnpm vitest run packages/eslint-rules

  test:
    name: Unit + integration (Postgres x2, OpenFGA, Valkey, OPA, Presidio, SeaweedFS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: vega, POSTGRES_USER: vega, POSTGRES_PASSWORD: vega_local_dev_only }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vega" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-evidence:
        image: postgres:16-alpine
        env: { POSTGRES_DB: vega_evidence, POSTGRES_USER: vega_evi, POSTGRES_PASSWORD: vega_evi_local_dev_only }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U vega_evi" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: OpenFGA (service containers cannot pass `run`)
        run: docker run -d --name openfga -p 8081:8080 openfga/openfga:v1.21.0 run
      - name: Database roles — the same files docker-compose mounts, so CI and local cannot drift
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/initdb/primary/01-roles.sql
          psql "$EVIDENCE_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/initdb/evidence/01-roles.sql
      - name: Wait for OpenFGA
        run: for i in $(seq 1 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
      - name: Module 5 services — OPA (test server), Presidio (pinned), SeaweedFS (S3)
        run: |
          docker run -d --name opa-test -p 8182:8181 mirror.gcr.io/openpolicyagent/opa:1.10.1-static run --server --addr 0.0.0.0:8181
          docker run -d --name presidio -p 5002:3000 mcr.microsoft.com/presidio-analyzer:2.2.362
          docker run -d --name seaweedfs -p 8333:8333 -e WEED_MASTER_VOLUME_GROWTH_COPY_1=1 -v "$PWD/infra/docker/seaweedfs:/etc/seaweedfs:ro" \
            chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=100 -master.volumeSizeLimitMB=64
      - name: Wait for OPA, Presidio and SeaweedFS
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8182/health && break; sleep 1; done
          for i in $(seq 1 120); do curl -sf localhost:5002/health && break; sleep 2; done
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333/ && break; sleep 2; done
      - run: pnpm test

  tenant-isolation:
    name: Tenant isolation (BLOCKING)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: vega, POSTGRES_USER: vega, POSTGRES_PASSWORD: vega_local_dev_only }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vega" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create the least-privilege application role
        # The suite MUST run as vega_app: PostgreSQL bypasses RLS for superusers even with
        # FORCE, so running it as the owner would pass and prove nothing.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/initdb/primary/01-roles.sql
      - run: pnpm db:migrate
      - name: Adversarial cross-tenant suite + schema coverage + pre-tenant resolver
        run: pnpm --filter @vega/db test:isolation

  e2e:
    name: E2E — sign in, invite, workspace, agent, connectors, plan sandbox, chat runs, policy console, holds and undo (real IdP, real browser, real OPA)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Local stack (Postgres x2, Zitadel, OpenFGA, Valkey)
        run: |
          chmod 0777 infra/docker/secrets
          docker compose -f infra/docker/docker-compose.yml up -d postgres postgres-evidence postgres-zitadel zitadel openfga-migrate openfga valkey seaweedfs presidio-analyzer
          for i in $(seq 1 90); do [ -s infra/docker/secrets/zitadel-bootstrap.pat ] && curl -sf localhost:8080/debug/healthz && break; sleep 2; done
      - name: Identity bootstrap (project, private_key_jwt app, provisioner)
        run: pnpm idp:bootstrap
      - name: Environment
        run: |
          cp .env.example .env
          sed -i "s#^SESSION_SECRET=.*#SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')#" .env
          sed -i "s#^LOCAL_KEK_BASE64=.*#LOCAL_KEK_BASE64=$(openssl rand -base64 32)#" .env
          echo "EVIDENCE_APPEND_TOKEN=$(openssl rand -hex 24)" >> .env
          echo "SIGNUP_ALLOW_PASSWORD=true" >> .env
          sed -i "s#^EXECUTION_INTERNAL_TOKEN=.*#EXECUTION_INTERNAL_TOKEN=$(openssl rand -hex 24)#" .env
          sed -i "s#^CONNECTOR_STATE_SECRET=.*#CONNECTOR_STATE_SECRET=$(openssl rand -base64 36 | tr -d '\n')#" .env
          sed -i "s#^EXTRACTOR_TOKEN=.*#EXTRACTOR_TOKEN=$(openssl rand -hex 24)#" .env
          # A Google OAuth client id the E2E consent test can see in the (intercepted) redirect.
          sed -i "s#^GOOGLE_CLIENT_ID=.*#GOOGLE_CLIENT_ID=e2e-google-client#; s#^GOOGLE_CLIENT_SECRET=.*#GOOGLE_CLIENT_SECRET=e2e-google-secret#" .env
          # Module 4: every provider call goes to the sandbox provider (the fakes over HTTP).
          echo "CONNECTOR_SANDBOX_URL=http://127.0.0.1:3099" >> .env
          # Module 6: held actions are pushed (NTFY_URL; the E2E suite plays the phone) with a one-tap revoke.
          echo "PUSH_TOPIC_SECRET=$(openssl rand -hex 24)" >> .env
      - name: Policy distribution (Module 5) — signing key, OPA configuration, signed baseline bundles, then OPA
        run: |
          pnpm db:migrate
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333/ && break; sleep 2; done
          pnpm policy:setup
          docker compose -f infra/docker/docker-compose.yml up -d opa
          for i in $(seq 1 60); do curl -sf localhost:8181/v1/data/system/bundles/presets/manifest/revision | grep -q presets && break; sleep 2; done
          for i in $(seq 1 120); do curl -sf localhost:5002/health && break; sleep 2; done
      - name: Start the sandbox provider, the four planes and the web app
        run: |
          (pnpm sandbox:providers > /tmp/sandbox.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -X POST localhost:3099/__sent && break; sleep 1; done
          for s in extractor evidence execution gateway control; do (pnpm --filter @vega/service-$s start > /tmp/$s.log 2>&1 &); sleep 3; done
          pnpm --filter @vega/web build
          (cd apps/web && GATEWAY_URL=http://localhost:3001 npx next start --port 3000 > /tmp/web.log 2>&1 &)
          for p in 3001 3002 3003 3004 3006; do for i in $(seq 1 60); do curl -sf localhost:$p/readyz && break; sleep 1; done; done
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Service logs on failure
        if: failure()
        run: tail -n 100 /tmp/*.log

  plane-separation:
    name: Plane separation policy — P0 (kind + Cilium)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: kind cluster without a default CNI (Cilium owns policy)
        uses: helm/kind-action@v1
        with:
          cluster_name: planes
          config: infra/tests/kind-config.yaml
      - uses: azure/setup-helm@v4
      - name: Cilium + cert-manager
        run: |
          helm repo add cilium https://helm.cilium.io && helm repo add jetstack https://charts.jetstack.io
          helm install cilium cilium/cilium --version 1.18.3 -n kube-system --set ipam.mode=kubernetes --set operator.replicas=1 --wait
          helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --version v1.18.2 --set crds.enabled=true --wait
      - name: Build and load images
        run: |
          docker build -f infra/docker/service.Dockerfile -t platform/service:dev .
          docker build -f infra/docker/web.Dockerfile -t platform/web:dev .
          kind load docker-image platform/service:dev platform/web:dev --name planes
      - name: Deploy the platform chart (policy-test profile)
        run: |
          infra/tests/dev-cluster-secrets.sh
          helm upgrade --install platform infra/helm/platform -f infra/helm/platform/values-dev-cluster.yaml
          kubectl wait --for=condition=available --timeout=300s deploy --all -n vega-control
          kubectl wait --for=condition=available --timeout=300s deploy --all -n vega-execution
          kubectl wait --for=condition=available --timeout=300s deploy --all -n vega-evidence
      - name: Plane separation policy test
        run: infra/tests/plane-separation.sh
      - name: Web-fetch isolation (SSRF at the network layer) — module2.md §13
        run: infra/tests/web-fetch-isolation.sh
      - name: Quarantined extractor isolation — module3.md §11.3 (BLOCKING)
        run: infra/tests/extractor-isolation.sh

  security:
    name: Supply chain (Trivy, OSV, Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
      - name: OSV-Scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with: { scan-args: '--lockfile=pnpm-lock.yaml' }
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with: { config: 'p/typescript p/nodejs p/secrets .semgrep/tokens.yml' }
      - name: Token-leak rules still catch their fixtures (module2.md §10.1)
        run: |
          pipx install semgrep
          n=$(semgrep --config .semgrep/tokens.yml --metrics=off --no-git-ignore --json .semgrep/fixtures/leaks.ts | jq '.results | length')
          test "$n" -eq 4 || { echo "expected 4 findings on the fixture, got $n"; exit 1; }

  # ---------------------------------------------------------------------------
  # Not yet implemented. Each line names the module that turns it on.
  # ---------------------------------------------------------------------------

  taint-soundness:
    name: 'Taint soundness — BLOCKING (module3.md §11.2)'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Seven properties over random programs (fast-check)
        env: { SOUNDNESS_RUNS: '2000' }
        run: npx vitest run evals/taint-soundness packages/taint packages/dsl packages/interpreter

  redteam-injection:
    name: 'Red-team injection — BLOCKING (module3.md §11.1)'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Zero successful exfiltrations. No exceptions, no skips.
        run: npx vitest run evals/redteam packages/planner services/extractor

  agent-core:
    name: 'Agent core — durability, at-most-once, hook order, ambiguity (BLOCKING, module4.md §11)'
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: vega, POSTGRES_USER: vega, POSTGRES_PASSWORD: vega_local_dev_only }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vega" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: OpenFGA (service containers cannot pass `run`)
        run: docker run -d --name openfga -p 8081:8080 openfga/openfga:v1.21.0 run
      - name: Database roles and schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/initdb/primary/01-roles.sql
          pnpm db:migrate
      - name: Wait for OpenFGA
        run: for i in $(seq 1 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
      - name: Executor (hook order, approvals, replans, limits, crash windows) and the chaos suite (worker processes SIGKILLed mid-run)
        run: npx vitest run services/execution/test/executor.test.ts services/execution/test/durability.test.ts
      - name: Across the planes (C1 → C2 → executor) and the ambiguity property (zero tolerance)
        env: { SOUNDNESS_RUNS: '2000' }
        run: npx vitest run services/control/test/runs.test.ts evals/taint-soundness/test/ambiguity.test.ts
      - name: C1 entity resolution (≥ 95%) and C2 program validity (≥ 90% first attempt)
        run: npx vitest run evals/intent

  policy-engine:
    name: 'Policy engine — fail closed, most restrictive wins, Rego ≡ reference, simulation (BLOCKING, module5.md §11)'
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: vega, POSTGRES_USER: vega, POSTGRES_PASSWORD: vega_local_dev_only }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vega" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: OpenFGA (service containers cannot pass `run`)
        run: docker run -d --name openfga -p 8081:8080 openfga/openfga:v1.21.0 run
      - name: Database roles and schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/initdb/primary/01-roles.sql
          pnpm db:migrate
      - name: Module 5 services — OPA (test server), Presidio (pinned), SeaweedFS (S3)
        run: |
          docker run -d --name opa-test -p 8182:8181 mirror.gcr.io/openpolicyagent/opa:1.10.1-static run --server --addr 0.0.0.0:8181
          docker run -d --name presidio -p 5002:3000 mcr.microsoft.com/presidio-analyzer:2.2.362
          docker run -d --name seaweedfs -p 8333:8333 -e WEED_MASTER_VOLUME_GROWTH_COPY_1=1 -v "$PWD/infra/docker/seaweedfs:/etc/seaweedfs:ro" \
            chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=100 -master.volumeSizeLimitMB=64
      - name: Wait for OPA, Presidio and SeaweedFS
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8182/health && break; sleep 1; done
          for i in $(seq 1 120); do curl -sf localhost:5002/health && break; sleep 2; done
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333/ && break; sleep 2; done
      - name: Wait for OpenFGA
        run: for i in $(seq 1 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
      - name: Compiler golden files, Rego unit tests, most-restrictive-wins (property), Rego ≡ reference evaluator (differential), signed bundles
        env: { DIFF_RUNS: '500' }
        run: npx vitest run packages/policy-engine/test/engine.test.ts packages/risk
      - name: Presidio recall on the professional-services corpus (≥ 95%)
        run: npx vitest run packages/policy-engine/test/classify.test.ts
      - name: The executor under policy — holds, dual approval, fail closed (OPA killed mid-run), reproducible risk, p99 < 50 ms
        run: npx vitest run services/execution/test/policy.test.ts
      - name: Authoring, simulation over 90 days, activation gate, signed distribution through object storage (OPA discovery), tamper refusal
        run: npx vitest run services/control/test/policies.test.ts

  compensator-correctness:
    name: 'Reversibility — compensators, sagas, holds, undo API (BLOCKING, module6.md §11)'
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: vega, POSTGRES_USER: vega, POSTGRES_PASSWORD: vega_local_dev_only }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vega" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: OpenFGA (service containers cannot pass `run`)
        run: docker run -d --name openfga -p 8081:8080 openfga/openfga:v1.21.0 run
      - name: Database roles and schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/initdb/primary/01-roles.sql
          pnpm db:migrate
      - name: Wait for OpenFGA
        run: for i in $(seq 1 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
      - name: 'Compensator correctness against the sandbox providers: every R1/R2 tool covered, state restored, idempotent (≥ 99%)'
        run: npx vitest run evals/compensation packages/compensators
      - name: 'The executor: capture before the call, the saga in reverse order, incidents, divergence abort, holds (timer ±1 s, restart, edit)'
        run: npx vitest run services/execution/test/reversibility.test.ts
      - name: 'The undo API: revoke asymmetry, the one-tap capability, confirmation, expiry'
        run: npx vitest run services/control/test/reversibility.test.ts

  chain-integrity:
    name: 'Audit chain integrity — P0 (enable in M7)'
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Continuous verification across all environments."
